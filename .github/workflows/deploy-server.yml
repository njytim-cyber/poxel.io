# Deploys the game server to Fly.io (runs on GitHub, so nothing needs installing on the PC).
# Only runs when started by hand: Actions tab -> "Deploy game server" -> Run workflow.
# Needs repository secrets FLY_API_TOKEN (fly.io dashboard -> Tokens) and ORIGIN_SECRET (same value as the Worker's).
name: Deploy game server
on:
  workflow_dispatch:
    inputs:
      first_time:
        description: 'First deploy: create the app and its save-data volume'
        type: boolean
        default: false
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Typecheck and unit tests
        run: npx tsc -p tsconfig.server.json && npm run test:unit
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app and volume
        if: ${{ inputs.first_time }}
        run: |
          flyctl apps create poxel-game --org personal || true
          flyctl volumes list --app poxel-game | grep -q poxel_data || flyctl volumes create poxel_data --app poxel-game --region sin --size 1 --yes
      - name: Shared secret with the Cloudflare Worker
        run: echo "ORIGIN_SECRET=${{ secrets.ORIGIN_SECRET }}" | flyctl secrets import --stage --app poxel-game
      - run: flyctl deploy --remote-only
