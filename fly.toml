# Game server on Fly.io (Singapore). Players reach it only through the Cloudflare Worker.
# Deployed by .github/workflows/deploy-server.yml. Secret: ORIGIN_SECRET (same value as the Worker's).
app = "poxel-game"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 30 # time to save the world on shutdown

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "poxel_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # the world keeps running (crops grow, mobs move) even with nobody online
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
